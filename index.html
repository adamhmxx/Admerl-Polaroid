<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>admerl memories</title>
<script>
(function(){
  function wibHour(){ return (new Date().getUTCHours() + 7) % 24; }
  function apply(){
    var h = wibHour(), t = (h >= 18 || h < 6) ? "dark" : "light";
    if (document.documentElement.dataset.theme !== t) document.documentElement.dataset.theme = t;
  }
  apply();
  // Check again every minute and whenever the page comes back into view.
  setInterval(apply, 60000);
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") apply(); });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed infinite canvas with a dot grid; small semi-rounded panels float on the edges (title top-left, chapters + zoom top-right, tools bottom-center). */
:root{
  --canvas:#F5F5F4;
  --dot:#D6D3D1;
  --panel:#FFFFFF;
  --ink:#1C1917;
  --muted:#78716C;
  --line:#E7E5E4;
  --hover:#FAFAF9;
  --accent:#1C1917;
  --accent-soft:#E7E5E4;
  --danger:#D92D20;
  --ok:#16A34A;
  --warn:#D97706;
  --photo-bg:#E7E5E4;
  --r-lg:16px; --r-md:12px; --r-sm:10px;
  --font:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --shadow:0 1px 2px rgba(28,25,23,.06), 0 8px 24px -10px rgba(28,25,23,.18);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;touch-action:none;overscroll-behavior:none}
.popover,.ddmenu{touch-action:pan-y}
body{background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
body{letter-spacing:-.01em;font-variant-numeric:tabular-nums}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background-color:var(--canvas);
}
/* The dot grid is drawn on a canvas so it can ripple and glow under the pointer. */
#dots{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
#viewport.tool-hand{cursor:grab}
#viewport.panning,#viewport.panning *{cursor:grabbing!important}
#viewport.tool-note,#viewport.tool-section{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;--inv:1}
/* Other people's pointers, no names: just a colored arrow. */
#cursors{position:absolute;left:0;top:0;pointer-events:none;z-index:2147483000}
.cursor{position:absolute;left:0;top:0;width:22px;height:22px;transform-origin:0 0;transition:transform .09s linear,opacity .2s ease;will-change:transform}
.cursor svg{display:block;width:22px;height:22px;filter:drop-shadow(0 1px 1.5px rgba(28,25,23,.25))}
.cursor.off{opacity:0}
#layer-sections,#layer-items{position:absolute;left:0;top:0}

/* ---------- Polaroid ---------- */
.item{position:absolute;transform-origin:50% 50%}
.polaroid{--w:260px;width:var(--w);background:#FFFFFF;border-radius:0;
  padding:calc(var(--w)*.035) calc(var(--w)*.035) 0;
  box-shadow:0 1px 1px rgba(28,25,23,.06),0 2px 6px rgba(28,25,23,.06),0 14px 28px -14px rgba(28,25,23,.28);
  transition:box-shadow .15s}
.polaroid:hover{box-shadow:0 1px 1px rgba(28,25,23,.06),0 4px 10px rgba(28,25,23,.08),0 20px 36px -14px rgba(28,25,23,.32)}
.polaroid .ph{position:relative;width:100%;aspect-ratio:1;background:var(--photo-bg);overflow:hidden;border-radius:0}
.polaroid .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.polaroid .foot{display:flex;align-items:flex-start;gap:calc(var(--w)*.03);min-height:calc(var(--w)*.17);padding:calc(var(--w)*.035) 2px calc(var(--w)*.04)}
.polaroid .cap{flex:1;min-width:0;text-align:center;font-family:"Caveat","Bradley Hand","Segoe Print",cursive;font-weight:500;font-size:calc(var(--w)*.09);line-height:1.15;color:#292524;letter-spacing:-.01em;word-break:break-word;outline:none;border-radius:3px}
.polaroid.sel .cap:empty::before,.polaroid .cap[contenteditable="plaintext-only"]:empty::before,.polaroid .cap[contenteditable="true"]:empty::before{content:"Write a caption…";color:#A8A29E}
.polaroid .cap:focus:empty::before,.note .txt:focus:empty::before,.section .sec-name:focus:empty::before{content:none}
.polaroid.uploading .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%) 0 0/200% 100%;animation:shimmer 1.1s linear infinite}
.polaroid.uploading .ph img{opacity:.55;filter:saturate(.6)}
.polaroid.broken .ph::before{content:"Photo couldn’t load";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.05);color:var(--muted)}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- Handwritten note ---------- */
.note{--w:220px;--pen:#292524;width:var(--w);padding:4px 6px;border-radius:4px}
.note .txt{font-family:"Caveat","Bradley Hand","Segoe Print",cursive;font-weight:600;font-size:calc(var(--w)*.13);line-height:1.1;color:var(--pen);outline:none;white-space:pre-wrap;word-break:break-word;min-height:1.1em}
.note .txt:empty::before{content:"Write something…";opacity:.4}
.note.c-ink{--pen:#292524}.note.c-blue{--pen:#2F55D4}.note.c-red{--pen:#D33A2C}
.note.c-green{--pen:#1F8A4C}.note.c-violet{--pen:#6D3FD1}.note.c-gray{--pen:#78716C}

/* ---------- Section ---------- */
.section{position:absolute;border-radius:var(--r-lg);background:transparent}
.section .sec-ol{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.section .sec-ol rect{fill:none;stroke:transparent;stroke-width:calc(1px * var(--inv));stroke-dasharray:calc(8px * var(--inv)) calc(8px * var(--inv));stroke-linecap:round}
.section:hover:not(.sel) .sec-ol rect,.section.draft .sec-ol rect{stroke:#A8A29E}
.section .sec-title{position:absolute;left:0;bottom:100%;padding-bottom:calc(5px * var(--inv));transform-origin:0 100%;pointer-events:none}
.section .sec-name{pointer-events:auto;display:inline-block;max-width:none;white-space:nowrap;font-weight:600;
  font-family:"Caveat","Bradley Hand","Segoe Print",cursive;font-size:calc(20px * var(--inv));line-height:1;letter-spacing:-.01em;
  padding:.1em .15em;border-radius:.3em;background:transparent;color:var(--ink);outline:none;cursor:default}
.section .sec-name:empty::before{content:"Untitled";opacity:.55}
.section.draft{opacity:.85}

/* ---------- Selection ---------- */
.item.sel{outline:calc(2px * var(--inv)) solid var(--accent);outline-offset:calc(3px * var(--inv))}
.polaroid.sel{outline:none;box-shadow:0 1px 1px rgba(28,25,23,.06),0 3px 8px rgba(28,25,23,.08),0 16px 30px -14px rgba(28,25,23,.26)}
.section.sel{box-shadow:0 0 0 calc(2px * var(--inv)) var(--accent)}
.section.sel .sec-name{color:var(--accent)}
.handle{display:none;position:absolute;width:calc(16px * var(--inv));height:calc(16px * var(--inv));background:transparent;z-index:2}
.handle.tl{left:0;top:0;transform:translate(-50%,-50%);cursor:nwse-resize}
.handle.tr{right:0;top:0;transform:translate(50%,-50%);cursor:nesw-resize}
.handle.bl{left:0;bottom:0;transform:translate(-50%,50%);cursor:nesw-resize}
.handle.br{right:0;bottom:0;transform:translate(50%,50%);cursor:nwse-resize}
.item.handle-off .handle{display:none}
#world.single .sel > .handle{display:block}
@media (hover:hover) and (pointer:fine){ .item:hover > .handle{display:block} }
#marquee{position:absolute;border:calc(1px * var(--inv)) solid var(--accent);background:rgba(28,25,23,.08);pointer-events:none;border-radius:calc(2px * var(--inv))}

/* ---------- Floating chrome ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.topbar{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px, calc(env(safe-area-inset-left,0px) + 12px));right:max(16px, calc(env(safe-area-inset-right,0px) + 12px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:20}
.topbar > *{pointer-events:auto}
.logo-wrap{display:flex;flex-direction:column;gap:2px;pointer-events:none}
.logo{margin:0;font-family:"Caveat","Bradley Hand","Segoe Print",cursive;font-weight:600;font-size:34px;line-height:1;color:var(--ink);letter-spacing:-.01em;transform:rotate(-2deg);transform-origin:0 50%;padding:2px 4px 0}
.status{font-size:12px;color:var(--muted);padding-left:6px;display:none;align-items:center;gap:6px}
.status[data-s="error"]{display:inline-flex}
.status[data-s="local"],.status[data-s="slow"],.status[data-s="error"],.status[data-s="readonly"]{pointer-events:auto;cursor:pointer;margin-top:6px;padding:4px 10px 4px 8px;border-radius:999px;font-size:12px;font-weight:500;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A}
.status[data-s="error"]{background:#FEF2F2;color:#991B1B;border-color:#FECACA}
.status[data-s="local"] i,.status[data-s="slow"] i{background:var(--warn)}
.status i{width:6px;height:6px;border-radius:50%;background:#A8A29E;display:inline-block}
.status[data-s="saved"] i{background:var(--ok)}
.status[data-s="saving"] i{background:var(--warn)}
.status[data-s="error"] i{background:var(--danger)}
.right-tools{display:flex;gap:8px;align-items:flex-start;position:relative}
.tr-dock{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px, calc(env(safe-area-inset-right,0px) + 12px));display:flex;align-items:center;gap:8px;z-index:20}
.sec-dock{position:relative}
/* Top-right controls use the white button style from the Figma file (gradient fill, inner highlight, soft drop shadow). */
.pill-btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 14px;border-radius:var(--r-lg);font-weight:500;font-size:14px;line-height:1.4;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,0) 100%),#FFFFFF;border:1px solid rgba(30,30,30,.07);box-shadow:inset 0 0 0 1px #FFFFFF,0 2px 6px rgba(0,0,0,.07);color:#1E1E1E}
.pill-btn:hover{background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,0) 100%),#FAFAF9}
.pill-btn .count{font-size:12px;color:var(--muted);background:var(--hover);border-radius:6px;padding:0 6px}
.popover{position:absolute;top:calc(100% + 8px);right:0;width:260px;max-height:min(60vh,420px);overflow:auto;padding:6px}
.popover h4{margin:6px 8px 6px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:-.01em}
.sec-row{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:8px;border-radius:var(--r-md);font-size:13px}
.sec-row:hover{background:var(--hover)}
.sec-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-row .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.popover .empty{padding:10px 8px;color:var(--muted);font-size:13px;line-height:1.45}

.toolbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;z-index:20}
.tbtn{position:relative;width:40px;height:40px;border:0;background:transparent;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink)}
.tbtn:hover{background:var(--hover)}
.tbtn[aria-pressed="true"]{background:#FAFAF9;color:var(--ink)}
.tbtn svg{width:19px;height:19px}
.tbtn.primary{width:auto;height:40px;padding:0 16px 0 20px;display:flex;gap:8px;border-radius:var(--r-md);font-weight:500;font-size:14px;line-height:1.4;background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 100%),#1E1E1E;border:1px solid #1E1E1E;color:#FFFFFF;margin-left:4px}
.tbtn.primary:hover{background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 100%),#2E2E2E}
.sep{width:1px;height:22px;background:var(--line);margin:0 5px}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;
  background:var(--ink);color:#FFFFFF;font-size:12px;font-weight:500;padding:5px 8px;border-radius:var(--r-sm);pointer-events:none}
[data-tip] kbd{font-family:var(--mono)}

.zoom{display:flex;align-items:center;gap:2px;padding:5px}
.tr-dock .panel.zoom{border-radius:var(--r-lg);background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,0) 100%),#FFFFFF;border:1px solid rgba(30,30,30,.07);box-shadow:inset 0 0 0 1px #FFFFFF,0 2px 6px rgba(0,0,0,.07);color:#1E1E1E}
.zbtn{width:34px;height:34px;border:0;background:transparent;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink);position:relative}
.zbtn:hover{background:var(--hover)}
.zbtn svg{width:17px;height:17px}
#zoomPct{width:54px;height:34px;border:0;background:transparent;border-radius:var(--r-md);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
#zoomPct:hover{background:var(--hover)}

.ctx{position:fixed;z-index:25;display:flex;align-items:center;gap:2px;padding:4px;transform:translate(-50%,-100%)}
.ctx.hide{visibility:hidden}
.cbtn{height:32px;min-width:32px;padding:0 8px;border:0;background:transparent;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink);position:relative}
.cbtn:hover{background:var(--hover)}
.cbtn svg{width:16px;height:16px}
.cbtn.danger{color:var(--danger)}
.cbtn.danger:hover{background:#FEF2F2}
.cbtn[aria-pressed="true"]{background:#FAFAF9;color:var(--ink)}
.ctx [data-tip]:hover::after{bottom:auto;top:calc(100% + 8px)}
.swatch{width:32px;height:32px;border:0;background:transparent;border-radius:var(--r-sm);display:grid;place-items:center;padding:0}
.swatch:hover{background:var(--hover)}
.custom-ink{position:relative;cursor:pointer;color:var(--ink)}
.custom-ink svg{width:18px;height:18px}
.custom-ink input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.swatch span{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.swatch[aria-pressed="true"] span{box-shadow:0 0 0 2px #FFFFFF,0 0 0 3.5px var(--accent)}
.ctx .sep{height:18px;margin:0 3px}
.dd{position:relative;display:inline-flex}
.dd > .cbtn{padding:0 6px 0 8px;gap:6px}
.dd .chev{width:14px;height:14px}
.ddmenu{position:absolute;top:calc(100% + 8px);left:-4px;min-width:190px;padding:4px;display:flex;flex-direction:column;gap:1px;z-index:2}
.dditem{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px 0 8px;border:0;background:transparent;border-radius:var(--r-sm);font-size:13px;color:var(--ink);text-align:left}
.dditem svg{width:16px;height:16px;flex:none}
.dditem .nm{flex:1}
.dditem .rt{font-size:12px;color:var(--muted)}
.dditem:hover{background:var(--hover)}
.dditem[aria-pressed="true"]{background:#FAFAF9}
.add-menu{top:auto;bottom:calc(100% + 12px);left:auto;right:-4px;min-width:200px}
.ctx .label{font-size:12px;color:var(--muted);padding:0 8px 0 6px;white-space:nowrap}

.empty-card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px, calc(100vw - 32px));padding:28px 24px;text-align:center;z-index:15;display:flex;flex-direction:column;align-items:center}
.empty-card .empty-icon{width:32px;height:32px;color:var(--muted);margin:0 auto 14px;display:block}
.empty-card h2{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.empty-card p{margin:0 0 18px;color:var(--muted);line-height:1.5;font-size:13.5px}
.empty-card .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{height:40px;padding:0 20px;border-radius:var(--r-md);font-weight:500;font-size:14px;line-height:1.4;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,0) 100%),#FFFFFF;border:1px solid rgba(30,30,30,.07);box-shadow:inset 0 0 0 1px #FFFFFF,0 2px 6px rgba(0,0,0,.07);color:#1E1E1E}
.btn:hover{background:#FAFAF9}
.btn.primary{background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 100%),#1E1E1E;border:1px solid #1E1E1E;color:#FFFFFF;box-shadow:none}
.btn.primary:hover{background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 100%),#2E2E2E}

.drop{position:fixed;inset:10px;border:2px dashed var(--accent);border-radius:var(--r-lg);background:rgba(28,25,23,.06);display:grid;place-items:center;z-index:40;pointer-events:none}
.drop span{background:var(--accent);color:#FFFFFF;font-weight:500;padding:10px 16px;border-radius:var(--r-md)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:12px;
  background:var(--ink);color:#FFFFFF;padding:9px 10px 9px 14px;border-radius:var(--r-md);font-size:13px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast button{border:0;background:rgba(255,255,255,.12);color:#FFFFFF;border-radius:var(--r-sm);padding:5px 10px;font-weight:500;font-size:12.5px}
.toast button:hover{background:rgba(255,255,255,.2)}


@media (max-width:640px){
  .zoom .zbtn.zstep{display:none}
  .tbtn.primary .lbl{display:none}
  .tbtn.primary{padding:0 11px;width:40px;justify-content:center}

  .pill-btn .lbl{display:none}
  .toast{bottom:calc(132px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:440px){
  .tr-dock{flex-direction:column;align-items:flex-end}
  .tr-dock .zoom{order:-1}
}
@media (hover:none){
  [data-tip]:hover::after{display:none}
  .handle{width:calc(40px * var(--inv));height:calc(40px * var(--inv))}
  /* On touch, photos, notes and decorations scale with two fingers; corners resize chapters only. */
  #world.single .item.sel > .handle{display:none}
  .cbtn,.swatch{height:38px;min-width:38px}
  .dditem{height:42px}
}
#viewport{-webkit-touch-callout:none}
/* ---------- Polaroid extras: develop, film filters, tape & pin ---------- */
.polaroid .ph img{filter:var(--film, brightness(1) saturate(1) contrast(1) sepia(0) grayscale(0) hue-rotate(0deg))}
.polaroid.developing .ph img{animation:develop 5s cubic-bezier(.3,0,.15,1) both}
@keyframes develop{
  0%{filter:brightness(1.9) saturate(0) contrast(.35) sepia(.35) grayscale(0) hue-rotate(0deg);opacity:.85}
  100%{filter:var(--film, brightness(1) saturate(1) contrast(1) sepia(0) grayscale(0) hue-rotate(0deg));opacity:1}
}
.polaroid .deco{display:none;position:absolute;left:50%;pointer-events:none;z-index:3}
.polaroid[data-deco="tape"] .deco{display:block;top:calc(var(--w)*-.05);width:calc(var(--w)*.38);height:calc(var(--w)*.11);
  transform:translateX(-50%) rotate(var(--tape-rot,-3deg));background:var(--tape,rgba(231,229,228,.8));
  box-shadow:0 1px 1px rgba(28,25,23,.06);
  clip-path:polygon(0 8%,3% 0,6% 10%,9% 0,12% 8%,88% 0,91% 9%,94% 0,97% 10%,100% 2%,100% 92%,97% 100%,94% 90%,91% 100%,88% 92%,12% 100%,9% 90%,6% 100%,3% 92%,0 100%)}
.polaroid[data-deco="pin"] .deco{display:block;top:calc(var(--w)*-.025);width:calc(var(--w)*.07);height:calc(var(--w)*.07);border-radius:50%;
  transform:translateX(-50%);background:radial-gradient(circle at 35% 30%,#FFFFFF 0 10%,var(--pin,#D33A2C) 14% 100%);
  box-shadow:0 2px 3px rgba(28,25,23,.35)}
.thumb{width:22px;height:22px;border-radius:0;object-fit:cover;flex:none;background:var(--photo-bg)}

/* ---------- Pen strokes ---------- */
#viewport.tool-pen{cursor:crosshair}
.item.stroke{pointer-events:none}
.item.stroke svg{display:block;overflow:visible}
.item.stroke .hit{fill:none;stroke:transparent;stroke-width:calc(16px * var(--inv));stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke}
.item.stroke .ln{fill:none;stroke:var(--pen,#292524);stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.item.stroke.sel{outline-style:dashed}
.pen-live{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:99999}

/* ---------- Lightbox ---------- */
.lb{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(245,245,244,.97);
  padding:calc(56px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(56px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));touch-action:none}
.lb figure{margin:0;background:#FFFFFF;padding:14px 14px 0;border-radius:0;box-shadow:0 2px 6px rgba(28,25,23,.06),0 30px 60px -24px rgba(28,25,23,.35);max-width:100%;display:flex;flex-direction:column;align-items:center}
.lb img{display:block;max-width:min(86vw,1100px);max-height:calc(100vh - 220px);object-fit:contain;filter:var(--film,none)}
.lb figcaption{font-family:"Caveat","Bradley Hand","Segoe Print",cursive;font-weight:500;font-size:28px;line-height:1.15;color:#292524;text-align:center;padding:12px 8px 18px;min-height:56px;max-width:min(86vw,1100px)}
.lb .lb-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px, calc(env(safe-area-inset-right,0px) + 12px))}
.lb .lb-nav{position:absolute;top:50%;transform:translateY(-50%)}
.lb .lb-prev{left:max(16px, calc(env(safe-area-inset-left,0px) + 12px))}
.lb .lb-next{right:max(16px, calc(env(safe-area-inset-right,0px) + 12px))}
.lb .lb-count{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.round-btn{width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;padding:0;background:#FFFFFF;border:1px solid rgba(30,30,30,.07);box-shadow:0 2px 6px rgba(0,0,0,.07);color:var(--ink)}
.round-btn:hover{background:#FAFAF9}
.round-btn svg{width:18px;height:18px}
.round-btn:disabled{opacity:.35;cursor:default}
@media (max-width:640px){ .lb .lb-nav{display:none} .lb figcaption{font-size:22px} }

/* ---------- Slideshow ---------- */
body.presenting .topbar,body.presenting .toolbar,body.presenting .tr-dock,body.presenting .ctx,body.presenting .toast{display:none!important}
body.presenting #viewport{pointer-events:none}
.show-bar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:4px;padding:5px 6px 5px 14px;max-width:calc(100vw - 32px)}
.show-bar .show-title{font-family:"Caveat","Bradley Hand","Segoe Print",cursive;font-weight:600;font-size:20px;line-height:1;margin-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.show-bar .show-count{font-size:12px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- Editor sign-in & public view ---------- */
.auth{pointer-events:auto;margin-top:6px;position:relative}
.auth-btn{border:0;background:transparent;padding:2px 6px;margin-left:-2px;border-radius:var(--r-sm);font-size:12px;color:var(--muted);cursor:pointer}
.auth-btn:hover{background:var(--hover);color:var(--ink)}
.auth-pop{position:absolute;top:calc(100% + 6px);left:0;width:min(300px, calc(100vw - 32px));padding:14px;display:flex;flex-direction:column;gap:10px;z-index:30}
.auth-pop label{font-size:12px;color:var(--muted)}
.auth-pop input{height:40px;border:1px solid var(--line);border-radius:var(--r-md);padding:0 12px;font-size:14px;background:#FFFFFF;outline:none}
.auth-pop input:focus{border-color:#A8A29E}
.auth-pop .btn{width:100%}
.auth-pop p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.auth-pop p:empty{display:none}
body.viewer .toolbar{display:none}
body.viewer .handle{display:none!important}
body.viewer #viewport{cursor:grab}

/* ---------- Phones & touch: every tap target at least 40px tall, text at least 14px ---------- */
@media (max-width:640px), (hover:none) and (pointer:coarse){
  .zbtn,#zoomPct{height:40px;min-width:40px;font-size:14px}
  .pill-btn{height:52px;font-size:14px}
  .pill-btn .count{font-size:14px}
  .cbtn,.swatch{height:40px;min-width:40px;font-size:14px}
  .dditem{min-height:44px;font-size:14px}
  .dditem .rt{font-size:14px}
  .sec-row{min-height:44px;font-size:14px}
  .sec-row .n,.popover .empty{font-size:14px}
  .toast{font-size:14px}
  .toast button{min-height:40px;padding:0 14px;font-size:14px}
  .status[data-s="local"],.status[data-s="slow"],.status[data-s="error"],.status[data-s="readonly"]{min-height:40px;font-size:14px;padding:0 14px 0 12px}
  .auth-btn{min-height:40px;font-size:14px}
  .auth-pop label,.auth-pop p{font-size:14px}
  .ctx{flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 24px)}
  .ctx .dd > .cbtn > span{display:none}
  .ctx .label,.empty-card p,.drop span,.lb .lb-count,.show-bar .show-count{font-size:14px}
  /* Chapter titles: 14px text, with an invisible 40px-tall tap area around it. */
  .section .sec-name{font-size:calc(22px * var(--inv));padding:calc(13px * var(--inv)) calc(6px * var(--inv));margin:calc(-13px * var(--inv)) calc(-6px * var(--inv))}
}

/* ---------- Rotate: corner zones on desktop ---------- */
.item .rot{position:absolute;width:calc(32px * var(--inv));height:calc(32px * var(--inv));display:none;place-items:center;z-index:4;cursor:grab}
.item .rot svg{width:calc(15px * var(--inv));height:calc(15px * var(--inv));color:#A8A29E;opacity:0;transition:opacity .18s ease}
/* Each zone sits on its corner (a little inside the frame, mostly outside) so pointing at the corner finds it. */
.item .rot.tl{left:calc(-22px * var(--inv));top:calc(-22px * var(--inv))}
.item .rot.tr{right:calc(-22px * var(--inv));top:calc(-22px * var(--inv))}
.item .rot.bl{left:calc(-22px * var(--inv));bottom:calc(-22px * var(--inv))}
.item .rot.br{right:calc(-22px * var(--inv));bottom:calc(-22px * var(--inv))}
.item .handle{z-index:6}
@media (hover:hover) and (pointer:fine){
  .item:hover .rot,.item.sel .rot,.item.rotating .rot{display:grid}
  .item .rot:hover svg,.item.rotating .rot svg{opacity:1}
}
body.rotating,body.rotating *{cursor:grabbing!important}
body.viewer .item .rot{display:none!important}

/* ---------- Decorations: washi tape and pins, placed freely ---------- */
.item.deco{--w:140px;width:var(--w)}
.item.deco .deco-body{display:block}
.item.deco.kind-tape .deco-body{width:100%;height:calc(var(--w) * .28);
  background:var(--c);
  filter:drop-shadow(0 1px 1px rgba(28,25,23,.14));
  clip-path:polygon(0 8%,3% 0,6% 10%,9% 0,12% 8%,88% 0,91% 9%,94% 0,97% 10%,100% 2%,100% 92%,97% 100%,94% 90%,91% 100%,88% 92%,12% 100%,9% 90%,6% 100%,3% 92%,0 100%)}
.item.deco.kind-pin .deco-body{width:var(--w);height:var(--w);border-radius:50%;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.85) 0 11%,rgba(255,255,255,0) 15%),var(--c);
  box-shadow:inset 0 calc(var(--w) * -.08) calc(var(--w) * .14) rgba(0,0,0,.28),0 calc(var(--w) * .14) calc(var(--w) * .2) rgba(28,25,23,.35)}
.deco-menu{left:-4px;right:auto}

/* Icon line-draw on hover: each stroke is drawn from one end to the other */
button svg .draw{stroke-dasharray:1 1;stroke-dashoffset:0}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  button:hover svg .draw{animation:icon-draw var(--d, 1.28s) var(--ease, cubic-bezier(.45,0,.55,1)) var(--delay, 0s) both}
}
@keyframes icon-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .polaroid.uploading .ph::after{animation:none}
  .polaroid{transition:none}
}

/* ---------- Dark mode: 18:00–06:00 WIB ---------- */
:root[data-theme="dark"]{
  --canvas:#1C1917; --dot:#3A3532; --panel:#292524; --ink:#F5F5F4; --muted:#A8A29E;
  --line:#3A3532; --hover:#353130; --accent:#F5F5F4; --accent-soft:#44403C; --photo-bg:#292524;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-theme="dark"] .pill-btn,
:root[data-theme="dark"] .tr-dock .panel.zoom,
:root[data-theme="dark"] .btn:not(.primary){background:linear-gradient(180deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,0) 100%),#292524;border-color:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 2px 6px rgba(0,0,0,.35);color:#F5F5F4}
:root[data-theme="dark"] .pill-btn:hover,
:root[data-theme="dark"] .btn:not(.primary):hover{background:linear-gradient(180deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,0) 100%),#353130}
:root[data-theme="dark"] .round-btn{background:#292524;border-color:rgba(255,255,255,.08);box-shadow:0 2px 6px rgba(0,0,0,.35)}
:root[data-theme="dark"] .round-btn:hover,
:root[data-theme="dark"] .tbtn[aria-pressed="true"],
:root[data-theme="dark"] .cbtn[aria-pressed="true"],
:root[data-theme="dark"] .dditem[aria-pressed="true"]{background:#353130}
:root[data-theme="dark"] .tbtn.primary,
:root[data-theme="dark"] .btn.primary{background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(0,0,0,.05) 100%),#F5F5F4;border-color:#F5F5F4;color:#1C1917}
:root[data-theme="dark"] .tbtn.primary:hover,
:root[data-theme="dark"] .btn.primary:hover{background:#E7E5E4}
:root[data-theme="dark"] [data-tip]:hover::after,
:root[data-theme="dark"] .toast,
:root[data-theme="dark"] .drop span{color:#1C1917}
:root[data-theme="dark"] .toast button{background:rgba(0,0,0,.08);color:#1C1917}
:root[data-theme="dark"] .toast button:hover{background:rgba(0,0,0,.14)}
:root[data-theme="dark"] .swatch[aria-pressed="true"] span{box-shadow:0 0 0 2px #292524,0 0 0 3.5px var(--accent)}
:root[data-theme="dark"] .swatch span{border-color:rgba(255,255,255,.12)}
:root[data-theme="dark"] .section:hover:not(.sel) .sec-ol rect,
:root[data-theme="dark"] .section.draft .sec-ol rect{stroke:#78716C}
:root[data-theme="dark"] .lb{background:rgba(28,25,23,.97)}
:root[data-theme="dark"] .auth-pop input{background:#1C1917}
:root[data-theme="dark"] .item .rot svg{color:#78716C}
/* Handwriting on the canvas keeps its hue but turns light enough to read on the dark board. */
:root[data-theme="dark"] .note .txt{color:color-mix(in srgb, var(--pen) 38%, #F5F5F4)}
:root[data-theme="dark"] .item.stroke .ln{stroke:color-mix(in srgb, var(--pen) 38%, #F5F5F4)}
:root[data-theme="dark"] .pen-live path{stroke:color-mix(in srgb, var(--pen) 38%, #F5F5F4)}
:root[data-theme="dark"] .polaroid{box-shadow:0 1px 1px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.25),0 14px 28px -14px rgba(0,0,0,.6)}
</style>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const vp = $("#viewport"), world = $("#world");
const secLayer = $("#layer-sections"), itemLayer = $("#layer-items");
const marqueeEl = $("#marquee"), ctxEl = $("#ctx");

/* ---------------- state ---------------- */
const cam = { x: 0, y: 0, s: 1 };
const items = new Map();          // id -> item data
const els = new Map();            // id -> element
const busy = new Set();           // ids being manipulated locally (ignore remote echoes)
let selected = new Set();
let tool = "select";
let mode = "loading";             // loading | db | local
let db = null, assets = null;
let maxZ = 0;
let spaceDown = false;
let gesture = null;

/* ---------------- dot grid: wave + hover glow ---------------- */
// Dots brighten in soft bands that roll from the bottom-left to the top-right, forever;
// the dots around the pointer light up more than the rest.
const dotsCv = document.getElementById("dots"), dctx = dotsCv.getContext("2d");
let dotW = 0, dotH = 0, dotDpr = 1;
const dotPal = { light: { base: [168,162,158], hot: [87,83,78] }, dark: { base: [120,113,108], hot: [231,229,228] } };
const glow = { x: -1e4, y: -1e4, on: 0, target: 0 };
function sizeDots(){
  dotDpr = Math.min(2, devicePixelRatio || 1);
  dotW = vp.clientWidth; dotH = vp.clientHeight;
  dotsCv.width = Math.round(dotW * dotDpr); dotsCv.height = Math.round(dotH * dotDpr);
}
vp.addEventListener("pointermove", e => { glow.x = e.clientX; glow.y = e.clientY; glow.target = 1; });
vp.addEventListener("pointerdown", e => { glow.x = e.clientX; glow.y = e.clientY; glow.target = 1; });
vp.addEventListener("pointerleave", () => { glow.target = 0; });
addEventListener("pointerup", e => { if (e.pointerType === "touch") glow.target = 0; });
addEventListener("resize", () => { sizeDots(); });
function drawDots(now){
  requestAnimationFrame(drawDots);
  if (!dotW) sizeDots();
  glow.on += (glow.target - glow.on) * 0.12;
  const t = now / 1000, theme = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
  const pal = dotPal[theme];
  let g = 24 * cam.s; while (g < 12) g *= 4;
  const ox = ((cam.x % g) + g) % g + g / 2 - g, oy = ((cam.y % g) + g) % g + g / 2 - g;
  const c = dctx; c.setTransform(dotDpr, 0, 0, dotDpr, 0, 0); c.clearRect(0, 0, dotW, dotH);
  const R = 150, R2 = R * R, lam = 460, speed = 0.32, r0 = 1.05, A0 = 0.16, A1 = 0.84;
  const tau = Math.PI * 2, k = 1 / (Math.SQRT2 * lam);
  // Most dots are batched by brightness level (one fill per level); only the few under the pointer are drawn one by one.
  const LV = 14, paths = Array.from({ length: LV }, () => new Path2D()), hot = [];
  for (let y = oy; y < dotH + g; y += g) {
    for (let x = ox; x < dotW + g; x += g) {
      // Position along the bottom-left → top-right diagonal, moving with time.
      const w = 0.5 + 0.5 * Math.sin(tau * ((x - y) * k - t * speed)), w3 = w * w * w;
      const a = A0 + A1 * w3;
      if (glow.on > 0.01) {
        const dx = x - glow.x, dy = y - glow.y, d2 = dx * dx + dy * dy;
        if (d2 < R2) { const f = 1 - Math.sqrt(d2) / R, b = f * f * glow.on; if (b > 0.02) { hot.push(x, y, Math.min(1, a + b), b); continue; } }
      }
      // The crest is brighter and the dots swell a little as it passes.
      const l = Math.min(LV - 1, Math.round(w3 * (LV - 1))), rr = r0 + 0.45 * l / (LV - 1);
      paths[l].moveTo(x + rr, y); paths[l].arc(x, y, rr, 0, tau);
    }
  }
  const [br, bg, bb] = pal.base;
  for (let l = 0; l < LV; l++) { c.fillStyle = `rgba(${br},${bg},${bb},${(A0 + A1 * l / (LV - 1)).toFixed(3)})`; c.fill(paths[l]); }
  for (let n = 0; n < hot.length; n += 4) {
    const x = hot[n], y = hot[n + 1], a = hot[n + 2], m = hot[n + 3];
    c.fillStyle = `rgba(${Math.round(br + (pal.hot[0] - br) * m)},${Math.round(bg + (pal.hot[1] - bg) * m)},${Math.round(bb + (pal.hot[2] - bb) * m)},${a.toFixed(3)})`;
    c.beginPath(); c.arc(x, y, r0 + m * 0.55, 0, tau); c.fill();
  }
}
requestAnimationFrame(drawDots);

let camSaveT, camReady = false;
function applyCam(){

function zoomAt(sx, sy, s){

  cam.s = s; cam.x = sx - w.x * s; cam.y = sy - w.y * s;

function zoomBy(f){ zoomAt(innerWidth/2, innerHeight/2, cam.s * f); }
function zoomToRect(r, maxS = 1.2){
  const narrow = innerWidth < 640, top = narrow ? 70 : 80, bottom = narrow ? 150 : 90, side = narrow ? 20 : 40;
  const aw = Math.max(100, innerWidth - side*2), ah = Math.max(100, innerHeight - top - bottom);
  const s = clamp(Math.min(aw / r.w, ah / r.h, maxS), 0.06, 4);
  cam.s = s;
  cam.x = side + (aw - r.w * s) / 2 - r.x * s;

let needFit = false;
function fitAll(){

  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;

    x2 = Math.max(x2, b.x + b.w); y2 = Math.max(y2, b.y + b.h);

function build(it){
  const el = document.createElement("div");
  el.dataset.id = it.id;
  if (it.type === "photo") {
    el.className = "item polaroid";
    const rotIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 4.5v4h-4"/></svg>';
    el.innerHTML = ["tl","tr","bl","br"].map(c => `<div class="rot ${c}" aria-hidden="true">${rotIcon}</div>`).join("") + `<div class="deco"></div><div class="ph"><img alt="" draggable="false" decoding="async"></div><div class="foot"><div class="cap" spellcheck="false"></div></div>` + HANDLES;
    const img = el.querySelector("img");
    img.addEventListener("error", () => { if (img.getAttribute("src")) el.classList.add("broken"); });
    img.addEventListener("load", () => el.classList.remove("broken"));
  } else if (it.type === "stroke") {
    el.className = "item stroke";
    el.innerHTML = `<svg><path class="hit"/><path class="ln"/></svg>`;
  } else if (it.type === "deco") {
    el.className = "item deco";
    const rotIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 4.5v4h-4"/></svg>';
    // Pins are round, so only tape gets rotate corners.
    el.innerHTML = (it.kind === "pin" ? "" : ["tl","tr","bl","br"].map(c => `<div class="rot ${c}" aria-hidden="true">${rotIcon}</div>`).join("")) + `<div class="deco-body"></div>` + HANDLES;
  } else if (it.type === "note") {
    el.className = "item note";
    el.innerHTML = `<div class="txt" spellcheck="false"></div>` + HANDLES;
  } else {
    el.className = "section";
    el.innerHTML = `<svg class="sec-ol" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" rx="16" ry="16"/></svg><div class="sec-title"><span class="sec-name" spellcheck="false"></span></div>` + HANDLES;
  }
  return el;
}
function photoSrc(it){ return it._url || (it.storagePath ? supaPhotoUrl(it.storagePath) : it.assetId ? "/_blob/" + it.assetId : (it.src || it._tmp || "")); }

/* ---------------- persistence ---------------- */
const queues = new Map();
let pending = 0, writeDenied = false;
function setStatus(s, text){
  $("#status").dataset.s = s;
  $("#statusText").textContent = text || ({ saved:"Saved", saving:"Saving…", local:"Not syncing · this device only", slow:"Connecting…", error:"Couldn’t save · retrying", loading:"Loading…", readonly:"View only" })[s];
}
let localReason = "";
$("#status").addEventListener("click", () => {
  const st = $("#status").dataset.s;
  if (st === "local") toast(localReason || "Online saving isn’t available here, so photos stay on this device. Open this board at claude.ai in a browser where you’re signed in to save and see them everywhere.", { duration: 9000 });
  else if (st === "error") toast("Some changes haven’t reached the online board yet. They’ll retry automatically while this page is open.", { duration: 7000 });
  else if (st === "readonly") toast("You can view this board but not change it.", { duration: 5000 });
  else if (st === "slow") toast("Still connecting to the online board…", { duration: 4000 });
});
function enqueue(id, fn, attempt = 0){
  pending++; setStatus("saving");
  const p = (queues.get(id) || Promise.resolve()).then(fn).catch(err => {
    console.warn("write failed", err);
    const code = err && err.code;
    if (code === "not_granted" || code === "permission_denied" || code === "forbidden") {
      if (!writeDenied) { writeDenied = true; toast("You have view-only access. Changes won’t be saved."); }
      setStatus("readonly");
    } else {
      setStatus("error");
      if (attempt < 6) setTimeout(() => enqueue(id, fn, attempt + 1), Math.min(30000, 2000 * 2 ** attempt));
      else toast("Couldn’t save some changes. Check your connection and reload.");
    }
  }).finally(() => {
    pending--;
    if (!pending && $("#status").dataset.s === "saving") setStatus("saved");
  });
  queues.set(id, p);
}
let localT;
function saveLocal(){
  clearTimeout(localT);
  localT = setTimeout(() => {
    const arr = [...items.values()].filter(it => !it._draft && !it._uploading).map(it => ({ id: it.id, ...clean(it) }));
    if (!lsSet("pw-items", JSON.stringify(arr))) toast("Browser storage is full. The latest photo may not be saved.");
  }, 250);
}
function persist(it){
  if (!it || it._draft || it._uploading) return;
  if (mode === "db") enqueue(it.id, () => db.collection("items").doc(it.id).set(clean(it)));
  else if (mode === "supa") { if (canEdit) enqueue(it.id, () => supaWrite(sb.from("items").upsert({ id: it.id, data: clean(it), updated_at: new Date().toISOString() }))); }
  else if (mode === "local") saveLocal();
}
async function supaWrite(q){
  const { error } = await q;
  if (error) {
    const denied = error.code === "42501" || /row-level security|permission|JWT/i.test(error.message || "");
    throw Object.assign(new Error(error.message), { code: denied ? "not_granted" : "unavailable" });
  }
}
function persistDelete(id){
  if (mode === "db") enqueue(id, () => db.collection("items").doc(id).delete());
  else if (mode === "supa") { if (canEdit) enqueue(id, () => supaWrite(sb.from("items").delete().eq("id", id))); }
  else if (mode === "local") saveLocal();
}
function saveTitle(t){

  else lsSet("pw-title", t);
}
function canAddPhotos(){ return mode === "local" || (mode === "db" && !!assets) || (mode === "supa" && canEdit); }

/* ---------------- init ---------------- */
function restoreCam(){
  try {
    const c = JSON.parse(lsGet("pw-cam") || "null");
    if (c && isFinite(c.x) && isFinite(c.y) && c.s > 0) { Object.assign(cam, c); camReady = true; applyCam(); return true; }
  } catch {}
  return false;
}
let inViewer = false;
function startLocal(reason){
  if (mode !== "loading") return;
  mode = "local";
  localReason = reason || "";
  setStatus("local");
  let arr = null;
  try { arr = JSON.parse(lsGet("pw-items") || "null"); } catch {}
  // Inside claude.ai, never show made-up examples: an empty board is honest.
  if (!Array.isArray(arr)) arr = inViewer ? [] : SAMPLE.map(x => ({ ...x }));
  arr.forEach(it => { items.set(it.id, it); render(it); });

  requestAnimationFrame(() => { if (!restoreCam()) fitAll(); });
}
async function init(){
  applyCam();

    if (window.supabase && typeof window.supabase.createClient === "function") { initSupabase(); return; }
    startLocal("The online board couldn’t be reached (the connection library didn’t load), so changes are saved on this device only. Reload to try again.");
    return;
  }
  // The viewer can attach window.claude a moment after the page starts; give it time.

async function prepareImage(file, maxDim, quality, keepOriginal){
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch { try { bmp = await createImageBitmap(file); } catch { throw new Error("decode"); } }
  const ratio = bmp.height / bmp.width;
  const scale = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));

    bmp.close && bmp.close(); return { blob: file, ratio };

  const cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);

/* ---------------- delete / duplicate ---------------- */
function deleteSelected(){
  const removed = [...selected].map(id => items.get(id)).filter(Boolean).map(it => ({ ...it }));
  if (!removed.length) return;
  removed.forEach(it => { items.delete(it.id); removeEl(it.id); persistDelete(it.id); });
  select([]); refreshMeta();
  // No notice on success. ⌘/Ctrl+Z restores the last delete; photo files are only removed after 30 s.
  if (lastDelete) { clearTimeout(lastDelete.timer); purgeRemoved(lastDelete.removed); }
  lastDelete = { removed, timer: setTimeout(() => { purgeRemoved(removed); lastDelete = null; }, 30000) };
}

  if (!lastDelete) return false;
  clearTimeout(lastDelete.timer);
  const { removed } = lastDelete; lastDelete = null;

  select(removed.map(r => r.id)); refreshMeta();

}
function purgeRemoved(removed){

    const still = new Set([...items.values()].map(i => i.assetId).filter(Boolean));
    removed.forEach(it => { if (it.assetId && !still.has(it.assetId)) assets.delete(it.assetId).catch(() => {}); });
  } else if (mode === "supa" && canEdit) {
    const still = new Set([...items.values()].map(i => i.storagePath).filter(Boolean));
    const gone = removed.map(it => it.storagePath).filter(p => p && !still.has(p));
    if (gone.length) sb.storage.from(SUPA.bucket).remove(gone).catch(() => {});
  }
}

/* ---------------- pen ---------------- */
function strokeD(pts){
  const n = pts.length / 2;
  if (n < 1) return "";
  const P = i => [pts[i*2], pts[i*2+1]];
  if (n === 1) { const [x, y] = P(0); return `M${x} ${y}l0.01 0`; }
  if (n === 2) { const [a, b] = P(0), [c, d] = P(1); return `M${a} ${b}L${c} ${d}`; }
  let d = `M${pts[0]} ${pts[1]}`;
  for (let i = 1; i < n - 1; i++) {
    const [x, y] = P(i), [nx, ny] = P(i + 1);
    d += `Q${x} ${y} ${((x + nx) / 2).toFixed(1)} ${((y + ny) / 2).toFixed(1)}`;
  }
  const [lx, ly] = P(n - 1);
  return d + `L${lx} ${ly}`;
}
function startPen(w){
  const size = +clamp(3 / cam.s, 1.5, 40).toFixed(1);
  const live = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  live.setAttribute("class", "pen-live");
  live.setAttribute("width", "1"); live.setAttribute("height", "1");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("fill", "none"); path.setAttribute("stroke", colorOf(penColor)); path.style.setProperty("--pen", colorOf(penColor));
  path.setAttribute("stroke-width", size); path.setAttribute("stroke-linecap", "round"); path.setAttribute("stroke-linejoin", "round");
  live.append(path); itemLayer.append(live);
  gesture = { kind:"pen", pts:[w.x, w.y], live, path, size };
  path.setAttribute("d", strokeD(gesture.pts));
  select([]);
}
function extendPen(w){
  const g = gesture, n = g.pts.length;
  if (Math.hypot(w.x - g.pts[n-2], w.y - g.pts[n-1]) < 1.5 / cam.s) return;
  g.pts.push(w.x, w.y);
  g.path.setAttribute("d", strokeD(g.pts));
}
function finishPen(g){
  g.live.remove();
  let pts = g.pts;
  while (pts.length > 3000) pts = pts.filter((_, i) => (i >> 1) % 2 === 0 || i >= pts.length - 2);
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (let i = 0; i < pts.length; i += 2) { x1 = Math.min(x1, pts[i]); x2 = Math.max(x2, pts[i]); y1 = Math.min(y1, pts[i+1]); y2 = Math.max(y2, pts[i+1]); }
  const rel = [];
  for (let i = 0; i < pts.length; i += 2) rel.push(+(pts[i] - x1).toFixed(1), +(pts[i+1] - y1).toFixed(1));
  addItem({ id: uid(), type:"stroke", x: Math.round(x1 * 10) / 10, y: Math.round(y1 * 10) / 10,
    w: Math.max(1, Math.ceil(x2 - x1)), h: Math.max(1, Math.ceil(y2 - y1)), pts: rel, color: penColor, size: g.size });
}

const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const show = { on: false, slides: [], i: 0, paused: false, timer: 0, raf: 0, sec: null };
function camForRect(r, maxS, m){
  const aw = Math.max(100, innerWidth - m.side * 2), ah = Math.max(100, innerHeight - m.top - m.bottom);
  const s = clamp(Math.min(aw / r.w, ah / r.h, maxS), 0.06, 4);
  return { s, x: m.side + (aw - r.w * s) / 2 - r.x * s, y: m.top + (ah - r.h * s) / 2 - r.y * s };

function animateCam(t, ms = 1600){

  const W = innerWidth / 2, H = innerHeight / 2;
  const c0 = { x: (W - cam.x) / cam.s, y: (H - cam.y) / cam.s, ls: Math.log(cam.s) };
  const c1 = { x: (W - t.x) / t.s, y: (H - t.y) / t.s, ls: Math.log(t.s) };
  const t0 = performance.now();

  const step = now => {

    const cx = c0.x + (c1.x - c0.x) * k, cy = c0.y + (c1.y - c0.y) * k;
    cam.s = s; cam.x = W - cx * s; cam.y = H - cy * s; applyCam();
    if (k < 1) show.raf = requestAnimationFrame(step);

}
function startShow(sid){

  const photos = sortReading([...items.values()].filter(x => x.type === "photo" && kids.has(x.id)));
  if (!photos.length) { toast("Add photos to this chapter first."); return; }
  const M = { top: 40, bottom: 110, side: 40 };
  const overview = camForRect({ x: sec.x, y: sec.y - 40, w: sec.w, h: sec.h + 40 }, 1.2, M);
  show.slides = [overview, ...photos.map(p => {
    const b = bounds(p), pad = b.w * .22;
    return camForRect({ x: b.x - pad, y: b.y - pad, w: b.w + pad * 2, h: b.h + pad * 2 }, 2.5, M);
  })];
  show.on = true; show.i = 0; show.paused = false; show.sec = sec;
  select([]); closePops();
  document.body.classList.add("presenting");
  $("#showTitle").textContent = sec.title || "Untitled";
  $("#showBar").hidden = false;
  goSlide(0);
}
function goSlide(i){
  clearTimeout(show.timer);
  show.i = clamp(i, 0, show.slides.length - 1);
  animateCam(show.slides[show.i]);
  $("#showCount").textContent = show.i === 0 ? `0 / ${show.slides.length - 1}` : `${show.i} / ${show.slides.length - 1}`;
  $("#showPrev").disabled = show.i === 0;
  $("#showNext").disabled = show.i >= show.slides.length - 1;
  syncPlayBtn();
  if (!show.paused) {
    if (show.i < show.slides.length - 1) show.timer = setTimeout(() => goSlide(show.i + 1), 4600);
    else show.timer = setTimeout(() => { show.paused = true; animateCam(show.slides[0]); syncPlayBtn(); }, 4600);
  }
}
function syncPlayBtn(){
  const b = $("#showPlay");
  b.innerHTML = show.paused ? ICON.play : ICON.pause;
  b.setAttribute("aria-label", show.paused ? "Play" : "Pause");
  prepIcons(b);
}
function togglePlay(){
  show.paused = !show.paused;
  if (!show.paused && show.i >= show.slides.length - 1) { goSlide(1); return; }
  if (show.paused) { clearTimeout(show.timer); syncPlayBtn(); } else goSlide(show.i + 1);
}
function stopShow(){
  if (!show.on) return;
  show.on = false; clearTimeout(show.timer); cancelAnimationFrame(show.raf);
  document.body.classList.remove("presenting");
  $("#showBar").hidden = true;
  if (show.sec) select([show.sec.id]);
}
$("#showPrev").addEventListener("click", () => { show.paused = true; goSlide(show.i - 1); });
$("#showNext").addEventListener("click", () => { show.paused = true; goSlide(show.i + 1); });
$("#showPlay").addEventListener("click", togglePlay);
$("#showClose").addEventListener("click", stopShow);

// Keys for the overlays run before the board's own shortcuts.
addEventListener("keydown", e => {
  if (!$("#lb").hidden) {
    if (e.key === "Escape") closeLightbox();
    else if (e.key === "ArrowLeft") stepLb(-1);
    else if (e.key === "ArrowRight") stepLb(1);
    else return;
    e.preventDefault(); e.stopImmediatePropagation(); return;
  }
  if (show.on) {
    if (e.key === "Escape") stopShow();
    else if (e.key === "ArrowLeft") { show.paused = true; goSlide(show.i - 1); }
    else if (e.key === "ArrowRight") { show.paused = true; goSlide(show.i + 1); }
    else if (e.key === " ") togglePlay();
    else return;
    e.preventDefault(); e.stopImmediatePropagation();
  }
}, true);

/* ---------------- download chapter as PNG ---------------- */
function loadImg(src){
  return new Promise((res, rej) => { const im = new Image(); if (/^https?:/.test(src)) im.crossOrigin = "anonymous"; im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
function wrapLines(ctx, text, maxW){
  const out = [];
  for (const para of String(text || "").split("\n")) {
    let line = "";
    for (const word of para.split(/\s+/)) {
      const t = line ? line + " " + word : word;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
    }
    out.push(line);
  }
  return out;
}
async function downloadChapter(sid){
  const sec = items.get(sid); if (!sec) return;
  const dl = window.claude && typeof window.claude.use === "function" ? await window.claude.use("downloads") : null;
  const saveBlob = async (filename, data) => {
    if (dl) return dl.save({ filename, data });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(data); a.download = filename; document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  };
  try {
    await Promise.all([document.fonts.load('600 40px "Caveat"'), document.fonts.load('500 40px "Caveat"'), document.fonts.load('500 18px "Geist"')]).catch(() => {});
    const kids = childrenOf(sid).map(id => items.get(id)).filter(Boolean).sort((a, b) => (a.z || 0) - (b.z || 0));
    let x1 = sec.x, y1 = sec.y - 44, x2 = sec.x + sec.w, y2 = sec.y + sec.h;
    for (const it of kids) { const b = bounds(it); x1 = Math.min(x1, b.x - 20); y1 = Math.min(y1, b.y - 20); x2 = Math.max(x2, b.x + b.w + 20); y2 = Math.max(y2, b.y + b.h + 20); }
    const pad = 48; x1 -= pad; y1 -= pad; x2 += pad; y2 += pad;
    const W = x2 - x1, H = y2 - y1, k = Math.min(2, 4096 / Math.max(W, H));
    const cv = document.createElement("canvas");
    cv.width = Math.round(W * k); cv.height = Math.round(H * k);
    const c = cv.getContext("2d");
    c.scale(k, k); c.translate(-x1, -y1);
    c.fillStyle = "#F5F5F4"; c.fillRect(x1, y1, W, H);
    c.fillStyle = "#D6D3D1";
    for (let gx = Math.ceil(x1 / 24) * 24; gx < x2; gx += 24) for (let gy = Math.ceil(y1 / 24) * 24; gy < y2; gy += 24) { c.beginPath(); c.arc(gx, gy, 1, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = "#1C1917"; c.font = '600 26px "Caveat", cursive'; c.textBaseline = "alphabetic";
    c.fillText(sec.title || "Untitled", sec.x + 2, sec.y - 12);
    for (const it of kids) {
      const el = els.get(it.id), b = bounds(it);
      c.save();
      if (it.type === "stroke") {
        c.translate(it.x, it.y);
        c.strokeStyle = colorOf(it.color); c.lineWidth = it.size || 3; c.lineCap = "round"; c.lineJoin = "round";
        c.stroke(new Path2D(strokeD(it.pts || [])));
        c.restore(); continue;
      }
      c.translate(b.x + b.w / 2, b.y + b.h / 2); c.rotate((it.rot || 0) * Math.PI / 180); c.translate(-b.w / 2, -b.h / 2);
      if (it.type === "deco") {
        c.shadowColor = "rgba(28,25,23,.3)"; c.shadowBlur = 3; c.shadowOffsetY = 1.5;
        c.fillStyle = decoColor(it);
        if (it.kind === "pin") { c.beginPath(); c.arc(b.w / 2, b.w / 2, b.w / 2, 0, Math.PI * 2); c.fill(); }
        else c.fillRect(0, 0, b.w, b.w * .28);
        c.restore(); continue;
      }
      if (it.type === "note") {
        c.fillStyle = colorOf(it.color);
        const fs = it.w * .13; c.font = `600 ${fs}px "Caveat", cursive`; c.textBaseline = "top";
        wrapLines(c, it.text, it.w - 12).forEach((ln, i) => c.fillText(ln, 6, 4 + i * fs * 1.1));
        c.restore(); continue;
      }
      // photo
      const w = b.w, h = b.h, pd = w * .035;
      const ph = el ? el.querySelector(".ph") : null;
      const phH = ph ? ph.offsetHeight : w - pd * 2;
      c.shadowColor = "rgba(28,25,23,.22)"; c.shadowBlur = 22; c.shadowOffsetY = 8;
      c.fillStyle = "#FFFFFF"; c.fillRect(0, 0, w, h);
      c.shadowColor = "transparent";
      try {
        const im = await loadImg(photoSrc(it));
        const bw = w - pd * 2, bh = phH;
        const sc = Math.max(bw / im.naturalWidth, bh / im.naturalHeight);
        const sw = bw / sc, sh = bh / sc;
        c.save(); c.filter = filmOf(it).css;
        c.drawImage(im, (im.naturalWidth - sw) / 2, (im.naturalHeight - sh) / 2, sw, sh, pd, pd, bw, bh);
        c.restore();
      } catch { c.fillStyle = "#E7E5E4"; c.fillRect(pd, pd, w - pd * 2, phH); }
      if (it.caption) {
        const fs = w * .09; c.fillStyle = "#292524"; c.font = `500 ${fs}px "Caveat", cursive`; c.textAlign = "center"; c.textBaseline = "top";
        wrapLines(c, it.caption, w - pd * 2).forEach((ln, i) => c.fillText(ln, w / 2, pd + phH + w * .035 + i * fs * 1.15));
        c.textAlign = "left";
      }
      if (it.deco === "tape") {
        const hsh = hashId(it.id);
        c.save(); c.translate(w / 2, -w * .05 + w * .055); c.rotate(((hsh % 9) - 4) * Math.PI / 180);
        c.fillStyle = TAPES[hsh % TAPES.length]; c.fillRect(-w * .19, -w * .055, w * .38, w * .11); c.restore();
      } else if (it.deco === "pin") {
        const r0 = w * .035;
        c.save(); c.shadowColor = "rgba(28,25,23,.35)"; c.shadowBlur = 4; c.shadowOffsetY = 2;
        c.fillStyle = "#D33A2C"; c.beginPath(); c.arc(w / 2, -w * .025 + r0, r0, 0, Math.PI * 2); c.fill(); c.restore();
      }
      c.restore();
    }
    const blob = await new Promise(res => cv.toBlob(res, "image/png"));
    if (!blob) throw new Error("encode");
    const name = (sec.title || "chapter").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() || "chapter";
    await saveBlob(`${name}.png`, blob);
  } catch (err) {
    const code = err && err.code;
    if (code === "declined") return;
    toast(code === "rate_limited" ? "A download is already waiting for your answer." : "Couldn’t create the image. Try again.");
    console.warn(err);
  }
}

function prepIcons(root){
  root.querySelectorAll("button svg").forEach(svg => {
    if (svg.dataset.drawn) return;
    svg.dataset.drawn = "1";
    // One continuous pen: strokes draw one after another at a steady pace,
    // each taking time in proportion to its length.
    const TOTAL = 1.28;
    const parts = [...svg.querySelectorAll("path, rect, circle, line, polyline")];
    const lens = parts.map(el => { try { return el.getTotalLength() || 0; } catch { return 0; } });
    const sum = lens.reduce((a, b) => a + b, 0);
    let t = 0;
    parts.forEach((el, i) => {
      const share = sum > 0 ? lens[i] / sum : 1 / parts.length;
      const d = Math.max(0.144, TOTAL * share);
      el.setAttribute("pathLength", "1");
      el.classList.add("draw");
      el.style.setProperty("--d", d.toFixed(3) + "s");
      el.style.setProperty("--delay", t.toFixed(3) + "s");
      const first = i === 0, last = i === parts.length - 1;
      el.style.setProperty("--ease", first && last ? "cubic-bezier(.45,0,.55,1)" : first ? "cubic-bezier(.45,0,1,1)" : last ? "cubic-bezier(0,0,.55,1)" : "linear");
      t += d;
    });
  });
}
prepIcons(document);
new MutationObserver(muts => { for (const m of muts) for (const n of m.addedNodes) if (n.nodeType === 1) prepIcons(n.matches && n.matches("button") ? n.parentNode || n : n); })
  .observe(document.body, { childList: true, subtree: true });

init();
})();
</script>
